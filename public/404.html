<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="The page you're looking for could not be found — Cinema."
    >

    <title>404 — Page Not Found · Cinema</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    #252525 0%,
                    #111 45%,
                    #0a0a0a 100%
                );

            color: #f5f5f5;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            margin-bottom: 28px;
            padding: 7px 13px;

            border: 1px solid #333;
            border-radius: 999px;

            color: #aaa;
            background: rgba(255, 255, 255, 0.03);

            font-size: 13px;
            letter-spacing: 0.04em;
        }

        h1 {
            margin-bottom: 18px;

            font-size: clamp(56px, 10vw, 88px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.055em;
        }

        .title {
            margin-bottom: 14px;

            font-size: clamp(24px, 4vw, 32px);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .subtitle {
            max-width: 580px;
            margin: 0 auto 34px;

            color: #a8a8a8;
            font-size: 18px;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 13px 20px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #f5f5f5;
            color: #111;

            font-size: 15px;
            font-weight: 600;
            text-decoration: none;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .button:hover {
            background: #fff;
            border-color: #666;
            transform: translateY(-1px);
        }

        .button.secondary {
            background: transparent;
            color: #f5f5f5;
            border-color: #333;
        }

        .button.secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #555;
        }

        .github-icon,
        .home-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .footer {
            margin-top: 70px;

            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer a {
            color: #888;
            text-decoration: none;
        }

        .footer a:hover {
            color: #aaa;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="badge">
            Cinema
        </div>

        <h1>404</h1>

        <h2 class="title">Page Not Found</h2>

        <p class="subtitle">
            Looks like this screening has been cancelled.
            The page you're looking for doesn't exist or may have been moved.
        </p>

        <div class="actions">
            <a class="button" href="/">
                <svg class="home-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 3.1 3.5 10v10.5c0 .83.67 1.5 1.5 1.5h5v-6h4v6h5c.83 0 1.5-.67 1.5-1.5V10L12 3.1zM12 1 23 9.8l-1.25 1.56L20 10.08v10.42c0 1.93-1.57 3.5-3.5 3.5h-5v-6h1v-1h-1v7H5c-1.93 0-3.5-1.57-3.5-3.5V10.08L2.25 11.36 1 9.8 12 1z" />
                </svg>
                Back to Home
            </a>

            <a
                class="button secondary"
                href="https://github.com/PurrCoding/cinema"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.69-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.08.78 2.18v3.23c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
                </svg>
                View on GitHub
            </a>
        </div>

        <div class="footer">
            <p>
                Open source software ·
                <a
                    href="https://github.com/PurrCoding/cinema"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    PurrCoding / cinema
                </a>
                · GPL-3.0
            </p>
        </div>

    </main>

</body>
</html>
