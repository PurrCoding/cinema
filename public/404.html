<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="The page you're looking for could not be found — Cinema.">

    <title>404 — Page Not Found · Cinema</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% -20%, #252525 0%, #111 45%, #0a0a0a 100%);
            color: #f5f5f5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container { width: 100%; max-width: 680px; text-align: center; }

        h1 {
            margin-bottom: 18px;
            font-size: clamp(56px, 10vw, 88px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.055em;
        }

        .title {
            margin-bottom: 14px;
            font-size: clamp(24px, 4vw, 32px);
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .subtitle {
            max-width: 580px;
            margin: 0 auto;
            color: #a8a8a8;
            font-size: 18px;
            line-height: 1.65;
        }

        .footer {
            margin-top: 70px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer a { color: #888; text-decoration: none; }
        .footer a:hover { color: #aaa; text-decoration: underline; }
    </style>
</head>

<body>
    <main class="container">
        <h1>404</h1>

        <h2 class="title">Page Not Found</h2>

        <p class="subtitle">
            Looks like this screening has been cancelled.
            The page you're looking for doesn't exist or may have been moved.
        </p>

        <div class="footer">
            <p>
                Open source software ·
                <a href="https://github.com/PurrCoding/cinema" target="_blank" rel="noopener noreferrer">
                    PurrCoding / cinema
                </a>
                · GPL-3.0
            </p>
        </div>
    </main>
</body>
</html>
