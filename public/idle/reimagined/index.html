<!DOCTYPE html>
<html>
<head>
	<title>Cinema Idle — Reimagined</title>
</head>
<body>
	<main class="idle-page">
		<div class="ambient ambient-left"></div>
		<div class="ambient ambient-right"></div>
		<div class="grid"></div>

		<section class="welcome-panel">
			<div class="eyebrow">CINEMA</div>
			<div class="welcome" aria-label="Cinema"></div>
			<div class="status"><span class="status-dot"></span> THE THEATER IS IDLE</div>
			<p class="info">Nothing is playing right now.</p>
			<p class="hint">Open your spawn menu and select <strong>Request Video</strong> to add something to the queue.</p>
		</section>

		<footer class="footer">
			<span>READY WHEN YOU ARE</span>
			<span class="footer-line"></span>
			<span>CINEMA</span>
		</footer>
	</main>
	<link rel="stylesheet" href="css/style.css" type="text/css">
</body>
</html>
