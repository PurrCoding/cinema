<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Cinema — Find media</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> <span data-i18n="hero.eyebrow"></span></div>
      <h1 id="hero-title" data-i18n="hero.title"></h1>
      <p data-i18n="hero.description"></p>

      <div class="request-box">
        <div class="input-wrap">
          <i class="fa-solid fa-link" aria-hidden="true"></i>
          <input id="urlinput" type="url" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="url.placeholder" data-i18n-aria-label="url.aria" placeholder="https://youtube.com/watch?v=...">
          <button id="clear-btn" class="icon-btn hidden" type="button" aria-label="Clear URL">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <button id="submit-btn" class="request-btn" type="button">
          <span data-i18n="url.request"></span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <button id="support-info-btn" class="support-link" type="button">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <span data-i18n="url.support"></span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </section>

    <section class="providers" aria-labelledby="providers-title">
      <div class="section-heading">
        <div>
          <span class="section-kicker" data-i18n="services.kicker"></span>
          <h2 id="providers-title" data-i18n="services.title"></h2>
        </div>
      </div>

      <div id="services-grid" class="services-grid" aria-live="polite"></div>
      <p id="empty-state" class="empty-state hidden" data-i18n="services.empty"></p>
    </section>
  </main>

  <div id="codec-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="codec-title">
    <button class="modal-backdrop" data-action="close-codec" data-i18n-aria-label="dialog.close"></button>
    <div class="modal-card">
      <button class="modal-close" data-action="close-codec" data-i18n-aria-label="dialog.close">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <div class="modal-icon"><i class="fa-solid fa-video" aria-hidden="true"></i></div>
      <span class="section-kicker" data-i18n="codec.kicker"></span>
      <h2 id="codec-title" data-i18n="codec.title"></h2>
      <p><strong id="service-name-popup"></strong> <span data-i18n="codec.body"></span></p>
      <ol>
        <li data-i18n="codec.step1"></li>
        <li data-i18n="codec.step2"></li>
        <li data-i18n="codec.step3"></li>
      </ol>
      <div class="modal-actions">
        <button class="btn-secondary" data-action="close-codec" type="button" data-i18n="codec.cancel"></button>
        <button class="btn-primary" data-action="codec-instructions" type="button">
          <span data-i18n="codec.get"></span> <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div id="support-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="support-title">
    <button class="modal-backdrop" data-action="close-support" data-i18n-aria-label="dialog.closeSupport"></button>
    <div class="modal-card support-card">
      <button class="modal-close" data-action="close-support" data-i18n-aria-label="dialog.close">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <span class="section-kicker" data-i18n="support.kicker"></span>
      <h2 id="support-title" data-i18n="support.title"></h2>
      <p class="support-intro" data-i18n="support.intro"></p>
      <div id="support-content" class="support-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite">
    <i id="toast-icon" class="fa-solid fa-circle-check" aria-hidden="true"></i>
    <span id="toast-text"></span>
  </div>

  <script src="../i18n.js"></script>
  <script src="../translations.js"></script>
  <script src="./app.js"></script>
</body>
</html>
