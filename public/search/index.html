<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cinema - Request Media</title>
	<link rel="stylesheet" href="./styles/request.css">
</head>

<body>
	<!-- Codec requirements popup -->
	<div id="codec-popup" class="codec-popup hidden">
		<div class="popup-overlay" data-action="close-codec"></div>
		<div class="popup-content">
			<div class="popup-header">
				<h3 data-i18n="codec.title"></h3>
				<button class="close-btn" data-action="close-codec">×</button>
			</div>
			<div class="popup-body">
				<div class="popup-icon">🎥</div>
				<p><strong id="service-name-popup"></strong> <span data-i18n="codec.body"></span></p>
				<div class="instructions">
					<h4 data-i18n="codec.steps_title"></h4>
					<ol>
						<li data-i18n="codec.step1"></li>
						<li data-i18n="codec.step2"></li>
						<li data-i18n="codec.step3"></li>
					</ol>
				</div>
			</div>
			<div class="popup-actions">
				<button data-action="close-codec" class="btn-secondary" data-i18n="codec.cancel"></button>
				<button data-action="codec-instructions" class="btn-primary" data-i18n="codec.get"></button>
			</div>
		</div>
	</div>

	<!-- Main container -->
	<div class="app-container">
		<!-- Services grid -->
		<section class="services-section">
			<div class="services-grid" id="services-grid">
				<!-- Service cards populated by JavaScript -->
			</div>
		</section>

		<!-- URL input section -->
		<section class="url-section">
			<div class="url-container">
				<h2 class="url-title" data-i18n="url.title"></h2>
				<div class="input-group">
					<input
						id="urlinput"
						type="url"
						class="url-input"
						data-i18n-placeholder="url.placeholder" placeholder="Paste your video URL here..."
						autocomplete="off"
						spellcheck="false"
					>
					<button data-action="request-url" class="submit-btn" id="submit-btn">
						<span class="btn-text" data-i18n="url.request"></span>
						<span class="btn-icon">→</span>
					</button>
				</div>
				<div class="supported-formats">
					<span data-i18n="url.formats"></span>
				</div>
			</div>
		</section>

		<!-- Status indicator -->
		<div id="status-indicator" class="status-indicator hidden">
			<div class="status-content">
				<div class="spinner"></div>
				<span id="status-text" data-i18n="toast.checking"></span>
			</div>
		</div>
	</div>

	<script src="./i18n.js"></script>
	<script src="./translations.js"></script>
	<script src="./scripts/request.js"></script>
</body>
</html>
