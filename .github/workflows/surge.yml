name: Deploy static content to Surge

on:
  push:
    branches: ["master"]
    paths:
      - "public/**"
      - ".github/workflows/surge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "surge"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install minification tools
        run: npm install --global html-minifier-terser clean-css-cli terser

      - name: Verify public directory
        run: |
          test -d public
          test -f public/index.html
          echo "Public files: $(find public -type f | wc -l)"

      - name: Minify HTML files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            html-minifier-terser \
              --collapse-whitespace \
              --collapse-boolean-attributes \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --sort-attributes \
              --sort-class-name \
              --minify-css true \
              --minify-js true \
              --output "$file" \
              "$file"
          done < <(find public -type f -name "*.html" -print0)

      - name: Minify CSS files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            cleancss \
              -O3 \
              --output "$file" \
              "$file"
          done < <(find public -type f -name "*.css" -print0)

      - name: Minify JavaScript files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            terser "$file" \
              --ecma 2020 \
              --compress passes=3,ecma=2020 \
              --mangle \
              --comments false \
              --output "$file"
          done < <(find public -type f -name "*.js" -print0)

      - name: Verify Surge token
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "${SURGE_TOKEN:-}" ]; then
            echo "::error::SURGE_TOKEN is not available to this workflow."
            echo "Add SURGE_TOKEN under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          echo "SURGE_TOKEN is available."

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx surge ./public "https://gm-cinema.purrcoding.com"

      - name: Deployment successful
        run: |
          echo "::notice::Deployment successful: https://gm-cinema.purrcoding.com"