name: Deploy static content to Surge

on:
  push:
    branches: ["master"]
    paths:
      - "public/**"
      - ".github/workflows/surge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "surge"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install minification tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Minify HTML
        run: |
          find public -name "*.html" -type f | while read -r file; do
            html-minifier-terser \
              --collapse-whitespace \
              --collapse-boolean-attributes \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --sort-attributes \
              --sort-class-name \
              --minify-css true \
              --minify-js true \
              --output "$file" \
              "$file"
          done

      - name: Minify CSS
        run: |
          find public -name "*.css" -type f | while read -r file; do
            cleancss -O3 --output "$file" "$file"
          done

      - name: Minify JavaScript
        run: |
          find public -name "*.js" -type f | while read -r file; do
            terser "$file" \
              --ecma 2020 \
              --compress passes=3,ecma=2020 \
              --mangle \
              --comments false \
              --output "$file"
          done

      - name: Deploy to Surge
        run: npx surge ./public "https://gm-cinema.purrcoding.com"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Verify HTTPS
        run: |
          curl --fail --silent --show-error \
            --location \
            --max-time 30 \
            https://gm-cinema.purrcoding.com/

          echo "✓ HTTPS deployment is reachable"

      - name: Verify HTTP redirect
        run: |
          location=$(curl \
            --silent \
            --show-error \
            --head \
            --max-redirs 0 \
            --write-out '%{redirect_url}' \
            --output /dev/null \
            http://gm-cinema.purrcoding.com/)

          echo "Redirect: $location"

          test "$location" = "https://gm-cinema.purrcoding.com/" || {
            echo "✗ HTTP does not redirect to HTTPS"
            exit 1
          }

          echo "✓ HTTP → HTTPS works"