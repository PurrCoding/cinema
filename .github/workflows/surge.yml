name: Deploy static content to Surge

on:
  push:
    branches: ["master"]
    paths:
      - "public/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "surge"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install minification tools
        run: |
          echo "::group::Installing minification tools"
          npm install -g html-minifier-terser clean-css-cli terser
          echo "::endgroup::"

      - name: Verify public directory
        run: |
          echo "::group::Verifying public directory contents"
          echo "Files in public directory:"
          find public -type f | head -20
          echo "Total files: $(find public -type f | wc -l)"
          echo "::endgroup::"

      - name: Minify HTML files
        run: |
          echo "::group::Minifying HTML files in public/"

          find public -name "*.html" -type f | while read file; do
            echo "Processing: $file"

            original_size=$(stat -c%s "$file")

            html-minifier-terser \
              --collapse-whitespace \
              --collapse-boolean-attributes \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --sort-attributes \
              --sort-class-name \
              --minify-css true \
              --minify-js true \
              --output "$file" \
              "$file"

            new_size=$(stat -c%s "$file")
            savings=$((original_size - new_size))

            echo "✓ $file: ${original_size}B → ${new_size}B (saved ${savings}B)"
          done

          echo "::endgroup::"

      - name: Minify CSS files
        run: |
          echo "::group::Minifying CSS files in public/"

          find public -name "*.css" -type f | while read file; do
            echo "Processing: $file"

            original_size=$(stat -c%s "$file")

            cleancss -O3 \
              --output "$file" \
              "$file"

            new_size=$(stat -c%s "$file")
            savings=$((original_size - new_size))

            echo "✓ $file: ${original_size}B → ${new_size}B (saved ${savings}B)"
          done

          echo "::endgroup::"

      - name: Minify JavaScript files
        run: |
          echo "::group::Minifying JavaScript files in public/"

          find public -name "*.js" -type f | while read file; do
            echo "Processing: $file"

            original_size=$(stat -c%s "$file")

            terser "$file" \
              --ecma 2020 \
              --compress passes=3,ecma=2020 \
              --mangle \
              --comments false \
              --output "$file"

            new_size=$(stat -c%s "$file")
            savings=$((original_size - new_size))

            echo "✓ $file: ${original_size}B → ${new_size}B (saved ${savings}B)"
          done

          echo "::endgroup::"

      - name: Deploy to Surge
        run: npx surge ./public https://gm-cinema.purrcoding.com
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - name: Deployment success notification
        if: success()
        run: |
          echo "::notice::Deployment successful! Site available at https://gm-cinema.purrcoding.com"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "::error::Deployment failed. Check the logs above for details."
